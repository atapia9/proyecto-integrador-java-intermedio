name: Calificar y publicar reporte

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  calificar:
    name: Calificacion automatica
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio (con historial completo para revisar commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Correr el calificador automatico
        run: python3 scripts/calificar.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar el sitio para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    name: Publicar en GitHub Pages
    needs: calificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
